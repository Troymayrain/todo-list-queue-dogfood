[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-list"
version = "0.1.0"
description = "A small server-rendered Task List"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "playwright==1.54.0",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
