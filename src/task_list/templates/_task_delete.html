<li id="task-{{ task.id }}" data-task-id="{{ task.id }}" class="rounded-xl bg-white px-5 py-4 text-base shadow-sm ring-2 ring-blue-500">
  <section aria-labelledby="delete-task-{{ task.id }}-heading">
    <h3 id="delete-task-{{ task.id }}-heading" class="font-semibold text-slate-950">Permanently delete this Task?</h3>
    <p class="mt-2 text-slate-800">You are about to delete <strong>{{ task.title }}</strong>. This action cannot be undone.</p>
    <div class="mt-4 flex flex-wrap gap-3">
      <form method="post" action="/tasks/{{ task.id }}/delete" hx-post="/tasks/{{ task.id }}/delete" hx-target="#task-list" hx-swap="innerHTML" hx-push-url="{% if current_filter == 'all' %}/{% else %}/?filter={{ current_filter }}{% endif %}">
        <input type="hidden" name="filter" value="{{ current_filter }}">
        <button
          type="submit"
          aria-label="Permanently delete {{ task.title }}"
          autofocus
          class="min-h-11 rounded-lg bg-blue-700 px-5 py-2.5 font-semibold text-white shadow-sm transition hover:bg-blue-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-300"
        >Delete Task permanently</button>
      </form>
      <a
        href="{% if current_filter == 'all' %}/{% else %}/?filter={{ current_filter }}{% endif %}"
        hx-get="/tasks/{{ task.id }}?filter={{ current_filter }}&amp;focus=delete"
        hx-target="#task-{{ task.id }}"
        hx-swap="outerHTML"
        class="min-h-11 rounded-lg px-5 py-2.5 font-semibold text-slate-700 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-slate-300"
      >Cancel deletion</a>
    </div>
  </section>
</li>
