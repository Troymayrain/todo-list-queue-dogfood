{% if tasks %}
  <ol class="space-y-3">
    {% for task in tasks %}
      <li data-task-id="{{ task.id }}" class="rounded-xl bg-white px-5 py-4 text-base font-medium shadow-sm ring-1 ring-slate-200">
        {{ task.title }}
      </li>
    {% endfor %}
  </ol>
{% else %}
  <div class="rounded-2xl border-2 border-dashed border-slate-300 px-5 py-10 text-center">
    <p class="text-lg font-semibold">Your Task List is empty</p>
    <p class="mt-2 text-slate-600">Create your first Task using the form above.</p>
  </div>
{% endif %}
