{% if notice %}
  <div role="alert" tabindex="-1" autofocus class="mb-4 rounded-xl border border-amber-300 bg-amber-50 px-5 py-4 text-sm font-medium text-amber-900 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-amber-200">
    {{ notice }}
  </div>
{% endif %}
{% if tasks %}
  <ol class="space-y-3">
    {% for task in tasks %}
      {% include "_task_row.html" %}
    {% endfor %}
  </ol>
{% else %}
  <div class="rounded-2xl border-2 border-dashed border-slate-300 px-5 py-10 text-center">
    <p class="text-lg font-semibold">Your Task List is empty</p>
    <p class="mt-2 text-slate-600">Create your first Task using the form above.</p>
  </div>
{% endif %}
