<li id="task-{{ task.id }}" data-task-id="{{ task.id }}" class="rounded-xl bg-white px-5 py-4 text-base font-medium shadow-sm ring-2 ring-blue-500">
  <form method="post" action="/tasks/{{ task.id }}" hx-post="/tasks/{{ task.id }}" hx-target="#task-{{ task.id }}" hx-swap="outerHTML focus-scroll:#task-title-{{ task.id }}:focus" novalidate>
    <input type="hidden" name="filter" value="{{ current_filter }}">
    <label for="task-title-{{ task.id }}" class="block text-sm font-medium text-slate-800">Task Title</label>
    <input
      id="task-title-{{ task.id }}"
      name="title"
      type="text"
      maxlength="201"
      value="{{ edit_title_value }}"
      aria-describedby="task-title-{{ task.id }}-hint{% if edit_error %} task-title-{{ task.id }}-error{% endif %}"
      {% if edit_error %}aria-invalid="true"{% endif %}
      class="mt-2 min-h-11 w-full rounded-lg border px-3 py-2 text-base shadow-sm outline-none transition focus-visible:border-blue-600 focus-visible:ring-4 focus-visible:ring-blue-100 {% if edit_error %}border-red-600{% else %}border-slate-300{% endif %}"
      autofocus
    >
    <p id="task-title-{{ task.id }}-hint" class="mt-2 text-sm font-normal text-slate-500">Up to 200 characters.</p>
    {% if edit_error %}
      <p id="task-title-{{ task.id }}-error" role="alert" class="mt-2 text-sm font-medium text-red-700">{{ edit_error }}</p>
    {% endif %}
    <div class="mt-3 flex flex-wrap gap-3">
      <button type="submit" class="min-h-11 rounded-lg bg-blue-700 px-5 py-2.5 font-semibold text-white shadow-sm transition hover:bg-blue-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-300">Save Task Title</button>
      <a
        href="{% if current_filter == 'all' %}/{% else %}/?filter={{ current_filter }}{% endif %}"
        hx-get="/tasks/{{ task.id }}?filter={{ current_filter }}"
        hx-target="#task-{{ task.id }}"
        hx-swap="outerHTML focus-scroll:#task-title-{{ task.id }}:focus"
        class="min-h-11 rounded-lg px-5 py-2.5 font-semibold text-slate-700 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-slate-300"
      >Cancel editing</a>
    </div>
  </form>
</li>
