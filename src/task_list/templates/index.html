{% extends "base.html" %}

{% block content %}
  <header class="mb-8">
    <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-blue-700">Make progress visible</p>
    <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">Task List</h1>
    <p class="mt-3 max-w-xl text-base text-slate-600 sm:text-lg">Capture the next thing that needs your attention.</p>
  </header>

  <section aria-labelledby="create-heading" class="rounded-2xl bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-7">
    <h2 id="create-heading" class="text-lg font-semibold">Create a Task</h2>
    {% include "_form.html" %}
  </section>

  <section aria-labelledby="tasks-heading" class="mt-8">
    <h2 id="tasks-heading" class="sr-only">Tasks</h2>
    <div id="task-list" aria-live="polite">
      {% include "_task_list.html" %}
    </div>
  </section>
{% endblock %}
